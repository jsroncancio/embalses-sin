name: Explorar API XM

on:
  push:
    branches: [fase2-api-xm]
    paths: [scripts/explorar_xm.py, .github/workflows/explorar-xm.yml]
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydataxm pandas
      - run: python scripts/explorar_xm.py
